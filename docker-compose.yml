services:
  web:
    build: .
    env_file: .env
    environment:
      PORT: "8000"
      DATABASE_URL: "postgresql://app:${POSTGRES_PASSWORD}@db:5432/japanese"
    depends_on:
      db:
        condition: service_healthy
    expose: ["8000"]
    restart: unless-stopped
    volumes:
      # Shared with the host-side Telegram bot (mimichan_bot.py), which reads
      # sources.json and writes recent_episodes_cache.json via the web API.
      # Without these mounts each side has its own ephemeral copy inside the
      # container — edits from one are invisible to the other and vanish on
      # the next `docker compose up --build`.
      - ./sources.json:/app/sources.json
      - ./recent_episodes_cache.json:/app/recent_episodes_cache.json

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: japanese
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d japanese"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
