<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Episode — 日本語 Pipeline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="style.css" rel="stylesheet" />
</head>
<body class="bg-black text-gray-200 antialiased font-sans flex flex-col h-screen overflow-hidden selection:bg-purple-900 selection:text-white">

  <!-- Top Navigation -->
  <header class="h-14 box-content border-b border-gray-800 flex items-center px-4 shrink-0 bg-black z-10 relative" style="padding-top: env(safe-area-inset-top);">
    <div class="font-bold text-lg tracking-tight text-white mr-auto"><a href="index.html">日本語</a></div>
    <span class="text-gray-700 mx-2">|</span>
    <span class="text-gray-400 text-sm truncate max-w-xs" id="nav-title">Loading...</span>
    
    <div class="ml-auto flex items-center gap-1">
      <button id="btn-download-offline" class="p-2 text-gray-400 hover:text-white rounded-md hover:bg-gray-800 transition-colors" title="Download for Offline">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto p-4 md:p-8" id="app-content">
    <div id="ep-page">

      <!-- Page header -->
      <div id="ep-header" class="mb-5 flex items-start justify-between gap-4">
        <div>
          <a href="index.html" class="text-xs text-gray-600 hover:text-gray-400 transition-colors">← all episodes</a>
          <h1 class="text-xl font-bold mt-1 leading-snug" id="header-title">Loading...</h1>
          <div class="text-sm text-gray-500 mt-0.5 flex items-center gap-2 flex-wrap" id="header-meta">
            <!-- Channel, date, duration injected here -->
          </div>
        </div>
      </div>

      <!-- Unified Responsive Layout -->
      <div id="ep-two-col" class="flex gap-5 md:min-h-[calc(100vh-180px)]">

        <!-- Left column -->
        <div id="ep-left-col" class="flex-[3] min-w-0 flex flex-col gap-4">

          <!-- YouTube video player (hidden by default) -->
          <div id="yt-player-wrap" class="yt-container rounded-xl overflow-hidden bg-black hidden">
            <div id="yt-player"></div>
          </div>

          <!-- Audio player -->
          <div id="audio-player-wrap" class="sticky top-12 z-30 md:static bg-gray-950 md:bg-transparent -mx-4 md:mx-0 px-4 md:px-0 pb-2 md:pb-0">
            <div class="bg-gray-900 rounded-xl p-4 border border-gray-800">
              <audio id="audio-player" controls class="w-full" preload="metadata" style="color-scheme: dark;">
                <source id="audio-source" src="" type="audio/mpeg">
                <track id="audio-track" kind="subtitles" src="" srclang="ja" label="日本語">
              </audio>
            </div>
          </div>

          <!-- Controls row -->
          <div class="flex items-center gap-3 flex-wrap">
            <span class="text-xs text-gray-500 mr-1 hidden md:inline">Translations:</span>
            <button id="toggle-en" class="toggle-btn hidden md:inline-block" title="Toggle English translation">EN</button>
            <button id="toggle-zh" class="toggle-btn hidden md:inline-block" title="Toggle Chinese translation">ZH</button>

            <button id="btn-toggle-player" class="toggle-btn ml-2 hidden" title="Switch between video and audio-only playback">
              Audio only
            </button>

            <span class="text-gray-700 ml-2 hidden md:inline">|</span>
            <span class="text-xs text-gray-500 hidden md:inline">Speed:</span>
            <div class="hidden md:flex gap-1" id="speed-btns">
              <button class="speed-btn" data-speed="0.5">0.5×</button>
              <button class="speed-btn" data-speed="0.75">0.75×</button>
              <button class="speed-btn speed-active" data-speed="1">1×</button>
              <button class="speed-btn" data-speed="1.25">1.25×</button>
              <button class="speed-btn" data-speed="1.5">1.5×</button>
              <button class="speed-btn" data-speed="2">2×</button>
            </div>
            <div class="flex md:hidden items-center gap-1 ml-2">
              <button id="speed-down" class="speed-btn px-2">−</button>
              <span id="speed-display" class="text-xs text-gray-400 w-8 text-center tabular-nums">1×</span>
              <button id="speed-up" class="speed-btn px-2">+</button>
            </div>
          </div>

          <!-- Transcript card -->
          <div id="transcript-card" class="relative bg-gray-900 rounded-xl border border-gray-800 overflow-hidden flex flex-col flex-1">
            <div class="flex items-center justify-between px-3 py-2 border-b border-gray-800 shrink-0">
              <span class="text-xs text-gray-500">Transcript</span>
              <button id="btn-full-transcript" class="text-[10px] text-gray-500 hover:text-gray-300 transition-colors hidden">
                Full Screen ↗
              </button>
            </div>
            <div id="transcript-loading" class="p-6 text-center text-gray-500 text-sm">
              Loading transcript…
            </div>
            <div id="transcript-card-body" class="flex-1 overflow-hidden relative flex flex-col">
              <div id="transcript" class="overflow-y-auto p-2 hidden h-full"></div>
              <button id="jump-now-pill" class="jump-now-pill hidden" aria-label="Jump to now playing">↓ Now playing</button>
            </div>
          </div>
        </div>

        <!-- Right column -->
        <div id="side-panel" class="md:w-[350px] lg:w-[450px] shrink-0 flex flex-col bg-gray-900 md:border border-gray-800 md:rounded-xl overflow-hidden">
          <div id="drawer-handle" class="flex justify-center py-2 md:hidden cursor-pointer">
            <div class="w-10 h-1 bg-gray-700 rounded-full"></div>
          </div>
          <div class="flex border-b border-gray-800 shrink-0 overflow-x-auto no-scrollbar">
            <button class="tab-btn" data-tab="transcript" id="tab-btn-transcript">Transcript</button>
            <button class="tab-btn tab-active" data-tab="vocab">Vocab</button>
            <button class="tab-btn" data-tab="grammar">Grammar</button>
            <button class="tab-btn" data-tab="expressions">Phrases</button>
            <button class="tab-btn" data-tab="context" style="color:#a78bfa" title="Domain-specific and advanced terms beyond N1">Ctx</button>
          </div>
          <div id="panel-container" class="relative flex-1 overflow-hidden flex flex-col">
            <div id="panel-transcript" data-panel="transcript" class="hidden flex-col h-full overflow-hidden relative"></div>
            <div id="panel-vocab" data-panel="vocab" class="overflow-y-auto h-full p-2"><p class="text-gray-600 text-xs p-4">Loading…</p></div>
            <div id="panel-grammar" data-panel="grammar" class="hidden overflow-y-auto h-full p-2"><p class="text-gray-600 text-xs p-4">Loading…</p></div>
            <div id="panel-expressions" data-panel="expressions" class="hidden overflow-y-auto h-full p-2"><p class="text-gray-600 text-xs p-4">Loading…</p></div>
            <div id="panel-context" data-panel="context" class="hidden overflow-y-auto h-full p-2"><p class="text-gray-600 text-xs p-4">Loading…</p></div>
          </div>
          <div class="px-4 py-3 border-t border-gray-800 flex items-center justify-between bg-gray-900/50">
            <div class="flex gap-3">
              <a id="download-csv-link" href="#" class="text-[10px] text-gray-500 hover:text-gray-300 transition-colors">Download Anki cards (.csv)</a>
              <a id="source-link" href="#" target="_blank" rel="noopener" class="text-[10px] text-gray-500 hover:text-gray-300 transition-colors hidden">Source ↗</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modals and Triggers -->
    <div id="drawer-overlay" class="hidden fixed inset-0 bg-black/60 z-40 md:hidden"></div>

    <span id="fab-hint" class="fab-hint hidden">Translations</span>
    <div id="fab-translate" class="fixed z-50 md:hidden" style="bottom: 60px; right: 16px;">
      <div id="fab-tray" class="fab-tray-hidden flex flex-col items-end gap-2 mb-2">
        <button id="fab-zh-btn" class="fab-pill">ZH</button>
        <button id="fab-en-btn" class="fab-pill">EN</button>
      </div>
      <button id="fab-main" class="w-12 h-12 rounded-full border flex items-center justify-center shadow-xl transition-colors duration-150 bg-gray-900 border-gray-700 text-gray-400">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="M7 15h4M15 15h2M7 11h2M11 11h6"/>
        </svg>
      </button>
    </div>

    <div id="drawer-trigger-bar" class="fixed bottom-0 left-0 right-0 z-40 md:hidden bg-gray-950 border-t border-gray-800 px-4 py-2.5 flex items-center">
      <button id="btn-open-drawer" class="flex-1 flex items-center justify-center gap-2 text-sm text-gray-300 font-medium">
        <span id="drawer-label">Vocab · Grammar · Phrases</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
      </button>
    </div>

    <div id="transcript-modal" class="hidden fixed inset-0 z-[60] flex items-start justify-center pt-16 px-4 pb-4">
      <div id="modal-backdrop" class="fixed inset-0 bg-black/75"></div>
      <div class="relative z-10 bg-gray-900 border border-gray-800 rounded-xl w-full max-w-2xl max-h-[80vh] flex flex-col shadow-2xl overflow-hidden">
        <div class="flex items-center justify-between px-4 py-3 border-b border-gray-800 shrink-0">
          <span class="text-sm font-semibold text-gray-200">Full Transcript</span>
          <button id="modal-close" class="text-gray-500 hover:text-gray-200 transition-colors text-2xl leading-none px-1">×</button>
        </div>
        <div id="modal-transcript" class="overflow-y-auto flex-1 p-3"></div>
        <button id="modal-jump-pill" class="jump-now-pill hidden" aria-label="Jump to now playing">↓ Now playing</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module" src="player.js"></script>
</body>
</html>
