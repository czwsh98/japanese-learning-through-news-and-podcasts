<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Episodes — 日本語 Pipeline</title>
  <style>html,body{background:#000}</style>
  <script>
    (function(){
      var d=sessionStorage.getItem("navDir");
      if(d){document.documentElement.dataset.nav=d;sessionStorage.removeItem("navDir");}
      document.addEventListener("click",function(e){
        var a=e.target.closest("a[href]");if(!a)return;
        var h=a.getAttribute("href")||"";
        if(h.includes("episode.html"))sessionStorage.setItem("navDir","forward");
        else if(h.includes("index.html"))sessionStorage.setItem("navDir","back");
      },true);
    })();
  </script>
  <link href="style.css" rel="stylesheet" />
</head>

<body
  class="bg-gray-950 text-gray-100 antialiased font-sans flex flex-col h-screen overflow-hidden selection:bg-purple-900 selection:text-white">

  <!-- Top Navigation -->
  <nav class="border-b border-gray-800 px-6 flex items-center gap-4 shrink-0 bg-gray-950 z-40 relative" style="padding-top: calc(env(safe-area-inset-top) + 12px); padding-bottom: 12px;">
    <a href="index.html" class="flex flex-col leading-tight">
      <span class="font-bold text-white tracking-tight">Mimichan</span>
    </a>
    <span class="text-gray-700">|</span>
    <a href="index.html" class="text-white text-sm font-medium">Episodes</a>
    <a href="vocab.html" class="text-gray-400 hover:text-white text-sm transition-colors">Vocab</a>
    <a href="upload.html" class="text-gray-400 hover:text-white text-sm transition-colors">Upload</a>
  </nav>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto p-4 md:p-8" id="app-content">
    <div class="max-w-2xl mx-auto">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-white">Episodes</h1>
        <span class="text-sm text-gray-500" id="ep-count">Loading...</span>
      </div>

      <div id="episodes-list" class="space-y-2">
        <!-- Episodes will be injected here by JS -->
      </div>
    </div>
  </main>

  <script type="module" src="index.js"></script>
</body>

</html>
