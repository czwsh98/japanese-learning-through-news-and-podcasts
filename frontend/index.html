<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Episodes — 日本語 Pipeline</title>
  <style>html,body{background:#000}</style>
  <link href="style.css" rel="stylesheet" />
</head>

<body
  class="bg-black text-gray-200 antialiased font-sans flex flex-col h-screen overflow-hidden selection:bg-purple-900 selection:text-white">

  <!-- Top Navigation -->
  <header class="h-14 box-content border-b border-gray-800 flex items-center px-4 shrink-0 bg-black z-10 relative" style="padding-top: calc(env(safe-area-inset-top) + 12px);">
    <div class="font-bold text-lg tracking-tight text-white mr-auto">日本語</div>
    <div class="flex items-center gap-1">
      <a href="upload.html" class="p-2 text-gray-400 hover:text-white rounded-md hover:bg-gray-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto p-4 md:p-8" id="app-content">
    <div class="max-w-2xl mx-auto">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-white">Episodes</h1>
        <span class="text-sm text-gray-500" id="ep-count">Loading...</span>
      </div>

      <div id="episodes-list" class="space-y-2">
        <!-- Episodes will be injected here by JS -->
      </div>
    </div>
  </main>

  <script>
    // Add your actual username and password below
    const API_BASE = "https://mimichan.up.railway.app";
    const AUTH_HEADER = "";

    async function loadEpisodes() {
      try {
        const res = await fetch(`${API_BASE}/api/episodes`, {
          headers: AUTH_HEADER ? { "Authorization": AUTH_HEADER } : {}
        });
        if (!res.ok) throw new Error("Failed to fetch");
        const episodes = await res.json();

        document.getElementById("ep-count").innerText = `${episodes.length} episode${episodes.length !== 1 ? 's' : ''}`;

        const list = document.getElementById("episodes-list");
        if (episodes.length === 0) {
          list.innerHTML = `
            <div class="text-center py-24 border border-dashed border-gray-800 rounded-2xl">
              <div class="text-5xl mb-4">🎧</div>
              <p class="text-lg font-medium text-white mb-2">No episodes yet</p>
            </div>`;
          return;
        }

        list.innerHTML = episodes.map(ep => {
          const dateStr = ep.date;
          const yyyymm = dateStr.slice(0, 7);
          const dd = dateStr.slice(8);
          const title = ep.meta.title || 'Untitled Episode';
          const channel = ep.meta.channel || '';
          const duration = ep.meta.duration ? Math.floor(ep.meta.duration / 60) + ':' + String(ep.meta.duration % 60).padStart(2, '0') : '';

          let tags = '';
          if (ep.has_audio !== false) tags += `<span class="text-emerald-400">● audio</span> `;
          if (ep.has_transcript !== false) tags += `<span class="text-blue-400">● transcript</span> `;
          if ((ep.meta.url || '').includes('youtu')) tags += `<span class="text-red-400">● video</span>`;

          return `
            <div class="relative border border-gray-800 rounded-xl hover:border-gray-600 hover:bg-gray-900 transition-all group">
              <a href="episode.html?id=${dateStr}" class="block p-4">
                <div class="flex items-start gap-4">
                  <div class="shrink-0 text-center bg-gray-800 rounded-lg px-3 py-2 group-hover:bg-gray-700 transition-colors">
                    <div class="text-xs text-gray-400 font-mono">${yyyymm}</div>
                    <div class="text-lg font-bold font-mono leading-none text-white">${dd}</div>
                  </div>
                  <div class="flex-1 min-w-0">
                    <div class="font-medium text-white truncate">${title}</div>
                    <div class="text-sm text-gray-400 mt-0.5">${channel}</div>
                    <div class="flex items-center gap-3 mt-2 text-xs">${tags}</div>
                  </div>
                  ${duration ? `<div class="shrink-0 text-sm text-gray-500 font-mono pr-8">${duration}</div>` : ''}
                </div>
              </a>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        document.getElementById("episodes-list").innerHTML = `<p class="text-red-500">Error loading episodes. Could not reach ${API_BASE} — check that the server is running and reachable.</p>`;
      }
    }

    loadEpisodes();
  </script>
</body>

</html>
