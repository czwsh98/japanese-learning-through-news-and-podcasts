<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}日本語 Pipeline{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

  <nav class="border-b border-gray-800 px-6 py-3 flex items-center gap-4 sticky top-0 bg-gray-950 z-40">
    <a href="/" class="flex flex-col leading-tight">
      <span class="font-bold text-white tracking-tight">Mimichan</span>
      <span class="text-gray-500 text-xs font-normal">Learning Japanese through Listening Practices</span>
    </a>
    <span class="text-gray-700">|</span>
    <a href="/" class="text-gray-400 hover:text-white text-sm transition-colors">Episodes</a>
    <a href="/upload" class="text-gray-400 hover:text-white text-sm transition-colors">Upload</a>
    {% block nav_extra %}{% endblock %}
  </nav>

  <main class="max-w-screen-xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <!-- Tooltip (shared, positioned absolutely by JS) -->
  <div id="tooltip" class="hidden fixed z-50 pointer-events-none"></div>

  {% block scripts %}{% endblock %}
</body>
</html>
