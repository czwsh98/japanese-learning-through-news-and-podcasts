{% extends "base.html" %}
{% block title %}Register — Mimichan{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-sm">

    <h1 class="text-2xl font-bold text-white mb-1">Create account</h1>
    <p class="text-gray-500 text-sm mb-8">
      Already have an account?
      <a href="/login" class="text-blue-400 hover:text-blue-300 transition-colors">Sign in</a>
    </p>

    {% if error %}
    <div class="bg-red-950 border border-red-800 text-red-300 text-sm rounded-lg px-4 py-3 mb-6">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/register" class="space-y-4">
      <div>
        <label for="email" class="block text-sm text-gray-400 mb-1">Email</label>
        <input
          id="email" name="email" type="email" required autocomplete="email"
          class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm
                 placeholder-gray-600 focus:outline-none focus:border-blue-500 transition-colors"
          placeholder="you@example.com"
        >
      </div>

      <div>
        <label for="password" class="block text-sm text-gray-400 mb-1">Password
          <span class="text-gray-600 font-normal">(min 8 characters)</span>
        </label>
        <input
          id="password" name="password" type="password" required autocomplete="new-password"
          minlength="8"
          class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm
                 placeholder-gray-600 focus:outline-none focus:border-blue-500 transition-colors"
          placeholder="••••••••"
        >
      </div>

      <div>
        <label for="confirm" class="block text-sm text-gray-400 mb-1">Confirm password</label>
        <input
          id="confirm" name="confirm" type="password" required autocomplete="new-password"
          minlength="8"
          class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm
                 placeholder-gray-600 focus:outline-none focus:border-blue-500 transition-colors"
          placeholder="••••••••"
        >
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium
               rounded-lg px-4 py-2.5 transition-colors mt-2"
      >
        Create account
      </button>
    </form>

  </div>
</div>
{% endblock %}
